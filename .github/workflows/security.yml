name: Enterprise security gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  technical-gate:
    name: technical-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked app dependencies
        run: |
          npm ci
          npm ci --prefix mobile
      - name: Install pinned scanners
        run: |
          python -m pip install -r scripts/security/requirements.txt
          python scripts/security/install-tools.py "$RUNNER_TEMP/qr-upgrade-tools"
          echo "$RUNNER_TEMP/qr-upgrade-tools" >> "$GITHUB_PATH"
      - name: Verify secret-scan exception boundaries
        run: |
          if ! node scripts/security/check-gitleaks-allowlist.mjs >/dev/null 2>&1; then
            echo 'Secret-scan exception check failed.'
            exit 1
          fi
      - name: Scan commit history for secrets
        run: |
          if ! gitleaks git --redact=100 --no-banner --config .gitleaks.toml . >/dev/null 2>&1; then
            echo 'Commit-history secret scan failed. Investigate in an authorized private checkout.'
            exit 1
          fi
      - name: Collect and enforce technical evidence
        # Detailed reports stay on this ephemeral runner. Never upload them from this public workflow.
        run: |
          umask 077
          if ! npm run security:evidence >/dev/null 2>&1; then
            echo 'Technical checks failed. Collect diagnostic evidence in an authorized private checkout.'
            exit 1
          fi
          echo 'Technical checks passed. Detailed evidence was not published.'
  production-readiness:
    name: production-readiness
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: technical-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-security-review
    steps:
      # Keep the required readiness check fail-closed until approved restricted
      # storage can supply the technical and manual evidence with verified provenance.
      - name: Block release readiness without restricted evidence retrieval
        run: |
          echo 'Release readiness is blocked: restricted evidence retrieval is not configured.'
          exit 1
